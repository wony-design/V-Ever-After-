<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>2026 V Ever After</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="2026 V Ever After">
<meta name="theme-color" content="#12152b" id="tc">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="manifest" href="manifest.webmanifest?v=2">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Gowun+Dodum&family=Nanum+Myeongjo:wght@700;800&display=swap" rel="stylesheet">
<style>
/* ===== 1. 색과 글꼴: 공연 포스터의 남색·장미색에서 가져왔어요 ===== */
:root{
  --night:#12152b; --panel:#1c2142; --line:#343b6b;
  --silver:#d5d8ea; --dim:#8f94b8; --rose:#c8456a;
  --f:#7b96ff;  /* 프란체스: 파랑 */
  --r:#e8607f;  /* 레미: 장미빛 */
  --j:#e8b062;  /* 조이: 촛불빛 */
  --lv0:#2a3060; --off:#5b6190; --ok:#6fd3a0; color-scheme:dark;
}
html[data-theme=light]{--night:#f3f1f8;--panel:#fff;--line:#dad6e8;--silver:#1e2142;--dim:#666b92;--rose:#b8335a;
  --f:#3f5ad0;--r:#c13b61;--j:#9a6a17;--lv0:#e6e4f0;--off:#aaaecb;--ok:#1b8a5a;color-scheme:light}
*{box-sizing:border-box}
body{margin:0;background:var(--night);color:var(--silver);line-height:1.5;
  font-family:-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
.wrap{max-width:560px;margin:0 auto;padding:28px 18px 160px}
h1{font-family:"Cinzel","Nanum Myeongjo",serif;font-weight:600;font-size:30px;margin:0;letter-spacing:.04em}
.sub{color:var(--dim);font-size:14px;margin:4px 0 0}
.count{margin:22px 0 14px;font-size:14px;color:var(--dim)}
.count b{color:var(--silver);font-size:18px}

/* ===== 2. 기록 카드 ===== */
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin-bottom:12px;cursor:pointer}
.card:hover{border-color:var(--dim)}
.when{font-family:var(--fh);font-weight:700;font-size:17px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0 0}
.chip{font-size:13px;padding:3px 10px;border-radius:99px;border:1px solid}
.chip.f{color:var(--f)} .chip.r{color:var(--r)} .chip.j{color:var(--j)}
.comment{margin:10px 0 0;font-size:15px}
.empty{text-align:center;color:var(--dim);padding:48px 12px;border:1px dashed var(--line);border-radius:10px}

/* ===== 3. 버튼과 입력창 ===== */
button{font:inherit;cursor:pointer}
.add{position:fixed;right:max(18px,calc(50% - 262px));bottom:calc(76px + env(safe-area-inset-bottom));
  background:var(--rose);color:#fff;border:0;border-radius:99px;padding:13px 22px;font-weight:700;box-shadow:0 4px 16px #0008}
dialog{width:min(520px,calc(100% - 24px));max-height:92vh;overflow:auto;background:var(--panel);color:var(--silver);
  border:1px solid var(--line);border-radius:12px;padding:20px}
dialog::backdrop{background:#000a}
dialog h2{font-family:var(--fh);margin:0 0 14px;font-size:22px}
label{display:block;font-size:13px;color:var(--dim);margin:12px 0 4px}
input,select,textarea{width:100%;font:inherit;font-size:16px;color:var(--silver);background:var(--night);
  border:1px solid var(--line);border-radius:8px;padding:9px 10px}
textarea{min-height:90px;resize:vertical}
input[type=date]{cursor:pointer} /* 달력 아이콘이 어두운 배경에서도 보이게 */
.note{font-size:13px;color:var(--j);margin:6px 0 0}
.row{display:flex;gap:8px;margin-top:20px}
.row button{flex:1;padding:11px;border-radius:8px;border:1px solid var(--line);background:transparent;color:var(--silver)}
.row .save{background:var(--rose);border-color:var(--rose);color:#fff;font-weight:700}
.row .del{flex:0 0 auto;color:#ff8a8a}
:focus-visible{outline:2px solid var(--f);outline-offset:2px}
/* ===== 4. 2단계: 탭, 별점, 좌석, 캘린더, 통계 ===== */
h3{font-family:var(--fh);font-size:18px;margin:26px 0 8px}
h4{font-size:13px;color:var(--dim);margin:12px 0 4px;font-weight:400}
nav{position:fixed;left:0;right:0;bottom:0;z-index:5;display:flex;justify-content:center;background:var(--panel);
  border-top:1px solid var(--line);padding:4px 0 calc(4px + env(safe-area-inset-bottom))}
nav button{flex:1;max-width:120px;background:none;border:0;color:var(--dim);padding:10px 4px;font-size:14px}
nav button.on{color:var(--silver);font-weight:700}
.stars{display:flex;gap:2px}
.stars button{background:none;border:0;font-size:32px;color:var(--line);padding:0 3px;line-height:1}
.stars button.on{color:var(--j)}
.cardstars{color:var(--j);font-size:14px;letter-spacing:1px;margin:8px 0 0}
.meta{margin:6px 0 0;font-size:13px;color:var(--dim)}
.seatrow{display:flex;gap:8px}
.seatrow select{flex:1;min-width:0}
.fb{background:transparent;border:1px solid var(--line);color:var(--dim);border-radius:99px;padding:4px 10px;font-size:13px;margin:0 4px 4px 0}
.fb.on{color:#fff;background:var(--rose);border-color:var(--rose)}
.flt{display:flex;flex-wrap:wrap;align-items:center;gap:2px;margin-bottom:6px}
.flt .chip{min-width:64px;text-align:center;margin-right:6px}
.cal-head{display:flex;align-items:center;justify-content:space-between;margin:14px 0 8px}
.cal-head button{background:var(--panel);border:1px solid var(--line);color:var(--silver);border-radius:8px;width:42px;height:36px;font-size:18px}
.grid7{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.dow{text-align:center;font-size:12px;color:var(--dim)}
.day{min-height:54px;background:var(--panel);border:1px solid transparent;border-radius:8px;color:var(--silver);
  padding:5px 2px;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:14px}
.day.off{background:transparent;color:var(--off)}
.day.today{box-shadow:inset 0 0 0 1px var(--rose)}
.day.sel{border-color:var(--silver)}
.dots{display:flex;gap:3px;flex-wrap:wrap;justify-content:center}
.dot{width:6px;height:6px;border-radius:50%;background:var(--line)}
.dot.hit{background:var(--j)} .dot.seen{background:var(--rose)}
#calDetail h3{margin-top:18px}
.sess{display:flex;justify-content:space-between;align-items:center;gap:8px;background:var(--panel);
  border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:8px}
.sess.hl{border-color:var(--j)}
.sess .chips{margin-top:6px}
.sess .seen{color:var(--rose);font-size:13px}
.sess button,.more{background:transparent;border:1px solid var(--line);color:var(--silver);border-radius:8px;padding:8px 14px}
.more{width:100%;margin-top:4px}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.kpi small{display:block;color:var(--dim);font-size:12px}
.kpi b{font-size:18px}
.bar{display:grid;grid-template-columns:116px 1fr auto;align-items:center;gap:8px;font-size:14px;margin:6px 0}
.track{height:10px;background:var(--night);border-radius:5px;overflow:hidden}
.track i{display:block;height:100%;border-radius:5px}
.stage{background:#d5d8ea22;text-align:center;font-size:11px;letter-spacing:.3em;margin:4px 0 8px;padding:2px;border-radius:3px;color:var(--dim)}
.hrow{display:flex;align-items:center;gap:4px;margin-bottom:2px}
.rl{width:14px;font-size:10px;color:var(--dim)}
.hcells{flex:1;display:grid;grid-template-columns:repeat(22,1fr);gap:2px}
.s{display:block;aspect-ratio:1;border-radius:2px}
.lv0{background:var(--lv0)} .lv1{background:#f3cdd9} .lv2{background:#e79bb4}
.lv3{background:#d3688f} .lv4{background:#b03a69} .lv5{background:#7d1c47} .hold{background:#555a7a55}
.legend{display:flex;flex-wrap:wrap;gap:10px;font-size:12px;color:var(--dim);margin-bottom:8px}
.legend .s{display:inline-block;width:12px;vertical-align:middle;margin-right:4px}
/* ===== 5. 3단계: 달력 이벤트, 통계 표, 쿠폰·도장, 설정 ===== */
nav button{font-size:12.5px;padding:10px 2px}
.day{align-items:stretch;gap:2px;padding:4px 2px;min-height:84px;background:none;overflow:visible;text-align:center}
.dn{font-size:13px}
.eb{display:block;height:14px;margin:0 -5px;font-size:10px;line-height:14px;color:#1d2038;text-align:left;padding-left:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.eb.nil{background:none}
.eb.s{border-radius:4px 0 0 4px}.eb.e{border-radius:0 4px 4px 0}.eb.s.e{border-radius:4px}
.eb.lb{overflow:visible;position:relative;z-index:2;text-overflow:clip}
.tm{font-size:10.5px;color:var(--dim);line-height:1.25}
.tm.seen{color:var(--ok);font-weight:700}.tm.hit{color:var(--j);font-weight:700}
.sess .seen{color:var(--ok)}
.tb{width:100%;border-collapse:collapse;font-size:14px}
.tb th{color:var(--dim);font-weight:400;text-align:left;border-bottom:1px solid var(--line);padding:6px 4px;font-size:13px}
.tb td{padding:8px 4px;border-bottom:1px solid var(--line)}
.tb td:nth-last-child(2){color:var(--dim)}.tb th:last-child,.tb td:last-child{text-align:right}.tb td:last-child{font-weight:700}
.sp-h{display:flex;align-items:center;justify-content:space-between}
.srow{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid var(--line)}
.blur{filter:blur(7px);user-select:none;pointer-events:none}
.card.nb{cursor:default}
.stamps{display:flex;gap:6px;margin:12px 0}
.st{flex:1;aspect-ratio:1;border-radius:50%;border:1.5px dashed var(--line);display:grid;place-items:center;font-size:12px;font-style:normal;color:var(--dim)}
.st.ms{border-style:solid;border-color:var(--j)}.st.on{background:var(--rose);border-color:var(--rose);color:#fff}
.btnrow{display:flex;gap:6px;flex-wrap:wrap}
.sm,.hl2{background:transparent;border:1px solid var(--line);color:var(--silver);border-radius:8px;padding:7px 12px;font-size:13px}
.bn{display:flex;gap:14px;padding:8px 0;border-bottom:1px solid var(--line)}.bn:last-child{border:0}.bn b{flex:0 0 58px}
.led{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:13px;padding:7px 0;border-bottom:1px solid var(--line)}
details summary{cursor:pointer;color:var(--dim);font-size:14px;margin:12px 0 6px}
.day.nm{opacity:.35}
.chk{display:flex;align-items:center;gap:8px;font-size:15px;color:var(--silver);margin:16px 0 0}
.chk input{width:auto;margin:0}
.day.sun .dn{color:var(--r)}.day.sat .dn{color:var(--dim)}
.hd{display:flex;align-items:center;justify-content:space-between;gap:10px}
.add{position:static;box-shadow:none;padding:8px 16px;font-size:14px}
.hc{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin-bottom:12px}
.ht{font-size:14px;color:var(--dim);margin:0 0 10px;font-weight:700}
.hc summary.ht{cursor:pointer;margin:0;list-style:none;display:flex;justify-content:space-between}
.hc[open] summary.ht{margin-bottom:10px}
.empt{text-align:center;color:var(--dim);padding:14px 0;font-size:14px}
.empt i{display:block;font-style:normal;font-size:30px;margin-bottom:6px}
.rrow{display:flex;flex-wrap:wrap;align-items:center;gap:4px 10px;padding:9px 0;border-bottom:1px solid var(--line);cursor:pointer;font-size:14px}
.rrow:last-child{border:0}
.dchip{background:var(--night);border:1px solid var(--line);border-radius:8px;padding:2px 8px;font-size:12.5px;color:var(--dim);white-space:nowrap}
.cn{flex:1;min-width:0}
.st2{color:var(--j);font-size:13px;white-space:nowrap}
.cg{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.cb{border:1px solid var(--line);border-radius:12px;padding:10px 4px;text-align:center;font-size:13px}
.cnum{display:flex;justify-content:space-around;margin:8px 0 6px}
.cnum small{display:block;color:var(--dim);font-size:11px}
.cnum strong{font-size:22px;color:var(--dim)}.cnum .cur{color:var(--ok)}
.cb>small,.dbl small{color:var(--dim);font-size:11.5px}
.dbl{display:flex;justify-content:space-between;align-items:center;gap:8px;border:1px solid var(--line);border-radius:12px;padding:9px 12px;margin-top:8px;font-size:13px}
.bd{padding:6px 0}.bdr{display:flex;align-items:center;gap:10px;margin-top:6px;font-size:13px}
.bdr .track{flex:1}.bdr .meta{margin:0;white-space:nowrap}
.ms span{margin:0 1px}.ms .off{opacity:.3}
.nbig{width:100%;padding:15px;border:0;border-radius:12px;background:var(--rose);color:#fff;font-weight:700;font-size:16px;margin:4px 0 8px}
.bh{display:flex;justify-content:space-between;align-items:center;gap:8px}.ib{display:flex;gap:6px}
.sq{width:30px;height:30px;border-radius:8px;border:1px solid var(--line);background:var(--night);color:var(--silver);font-size:13px;padding:0}
.bl{display:flex;justify-content:space-between;margin:12px 0 6px;font-size:14px}.bl span{color:var(--dim);font-size:13px}
.pbar{position:relative;height:12px;border-radius:6px;background:var(--lv0);overflow:hidden}
.pbar>i:first-child{display:block;height:100%;background:var(--rose)}
.tick{position:absolute;top:0;bottom:0;width:2px;background:var(--dim)}.tick.on{background:var(--j)}
.ach{color:var(--j);font-size:13px;font-weight:700;margin:8px 0 10px}.ach.dim{color:var(--dim);font-weight:400}
/* ===== 6. 글꼴·날짜칸 정리 ===== */
:root{--fh:"Gowun Dodum","Nanum Myeongjo",sans-serif;--fw:400;--fls:.02em}
dialog{overflow-x:hidden;overflow-y:auto}
dialog h2:focus{outline:none}
input[type=date]{-webkit-appearance:none;appearance:none;display:block;width:100%;min-width:0;max-width:100%;height:44px;line-height:24px;text-align:left}
input[type=date]::-webkit-date-and-time-value{text-align:left;min-height:0;height:24px;line-height:24px;margin:0}
input[type=date]::-webkit-datetime-edit{padding:0}
h3,dialog h2,.when{font-weight:var(--fw,700);letter-spacing:var(--fls,0)}
/* ===== 7. 캘린더를 한 화면에 (모바일) ===== */
/* 배우 선택: 접지 않고 항상 보여요. 한 줄에 한 역할씩, 작게 */
#calFilter{margin-bottom:2px}
#calFilter .flt{flex-wrap:nowrap;gap:0;margin:0 0 3px}
#calFilter .flt .chip{flex:0 0 auto;width:60px;font-size:12px;padding:1px 0;margin-right:6px}
#calFilter .fb{flex:0 0 auto;width:58px;padding:3px 0;font-size:12.5px;margin:0 4px 0 0;white-space:nowrap}
#calFilter .fb:last-child{margin-right:0}
.cal-head{margin:8px 0 4px}.cal-head button{height:32px}
.grid7{gap:1px 3px}
.day{min-height:52px;padding:2px 1px;gap:0}
.wrap{padding-top:14px}
.sub{margin:0 0 6px}
.hd h1{font-size:26px}
.cal-head b{font-size:16px}
.dow{line-height:1.4}
.tm{line-height:1.15}
.eb{height:13px;line-height:13px}
#calDetail h3{margin:6px 0 4px;font-size:15px}
.sess{padding:6px 10px;margin-bottom:4px}
.sess .chips{margin-top:3px;gap:4px}
.sess .chip{font-size:12px;padding:1px 7px}
.sess .meta{margin:0}
#calDetail .more{padding:5px;font-size:13px;margin-top:0}
</style>
</head>
<body>
<div class="wrap">
  <div class="hd"><h1>🩸 V Ever After</h1><button class="add" id="addBtn">+ 기록</button></div>
  <p class="sub">관극 다이어리</p>
  <section id="tab-home" class="tab">
  <div id="list"></div>
  </section>
  <section id="tab-cal" class="tab" hidden>
    <div id="calFilter"></div>
    <div class="cal-head"><button type="button" id="prevM" aria-label="이전 달">‹</button><b id="calTitle"></b><button type="button" id="nextM" aria-label="다음 달">›</button></div>
    <div class="grid7" id="calGrid"></div>
    <div id="calDetail"></div>
  </section>
  <section id="tab-coupon" class="tab" hidden><div id="couponBox"></div></section>
  <section id="tab-stats" class="tab" hidden><div id="statsBox"></div></section>
  <section id="tab-set" class="tab" hidden><div id="setBox"></div></section>
</div>
<nav>
  <button type="button" data-tab="home" class="on">🏠 홈</button>
  <button type="button" data-tab="cal">📅 캘린더</button>
  <button type="button" data-tab="coupon">🎫 쿠폰</button>
  <button type="button" data-tab="stats">📊 통계</button>
  <button type="button" data-tab="set">⚙️ 설정</button>
</nav>

<dialog id="dlg">
  <h2 id="dlgTitle" tabindex="-1" autofocus>관극 기록</h2>
  <form id="form">
    <label for="date">날짜</label>
    <input type="date" id="date" required>
    <label for="time">시간</label>
    <select id="time" required></select>
    <p class="note" id="note" hidden>이 날짜는 일정표에 없어요. 시간과 배우를 직접 골라주세요.</p>
    <div id="castBox"></div>
    <label class="chk"><input type="checkbox" id="tbd"> 미정 (예매 미확정)</label>
    <label>좌석 (모르면 비워두세요)</label>
    <div class="seatrow">
      <select id="floor" aria-label="층"></select>
      <select id="row" aria-label="열"></select>
      <select id="num" aria-label="번호"></select>
    </div>
    <p class="note" id="grade" hidden></p>
    <label for="coupon">쿠폰종 (선택)</label>
    <select id="coupon"></select>
    <label for="price">티켓 가격 (원)</label>
    <input type="number" id="price" min="0" step="100" inputmode="numeric" placeholder="숫자만 입력">
    <label for="board">다관람 카드 도장 (선택)</label>
    <select id="board"></select>
    <input type="text" id="newBoard" maxlength="20" placeholder="새 도장판 이름 (비워두면 번호 자동)" hidden style="margin-top:8px">
    <label>별점</label>
    <div class="stars" id="stars"></div>
    <label for="comment">한줄 코멘트</label>
    <input type="text" id="comment" maxlength="60" placeholder="오늘 공연을 한 줄로 남겨보세요">
    <label for="memo">감상 메모</label>
    <textarea id="memo" placeholder="기억하고 싶은 장면, 넘버, 느낌"></textarea>
    <div class="row">
      <button type="button" class="del" id="delBtn" hidden>삭제</button>
      <button type="button" id="cancelBtn">취소</button>
      <button type="submit" class="save">저장</button>
    </div>
  </form>
</dialog>
<dialog id="dlg2"><h2 id="d2t" tabindex="-1" autofocus></h2>
  <form id="f2"><div id="d2b"></div>
    <div class="row"><button type="button" id="d2c">닫기</button><button type="submit" class="save" id="d2s">저장</button></div></form>
</dialog>
<input type="file" id="imp" accept=".json,application/json" hidden>

<script>
/* ===== 1. 공연 정보 (데이터) ===== */
const ROLES = {
  "프란체스": ["랑연", "이준우", "이승준"],
  "레미":     ["박경호", "권태하", "정단비"],
  "조이":     ["공현비", "이동연", "함태규"],
};
const ROLE_CLASS = { "프란체스": "f", "레미": "r", "조이": "j" };

// 일정표 한 줄 = "월-일 시(24시간) 프란체스·레미·조이". 글자 하나가 배우 한 명이에요.

let pastAll = false; // 최근 관람은 10건만 보이고, 더 보기를 누르면 전부 보여요
function renderHome() {
  const d0 = new Date(), t = `${d0.getFullYear()}-${pad(d0.getMonth() + 1)}-${pad(d0.getDate())} ${pad(d0.getHours())}:${pad(d0.getMinutes())}`;
  const key = r => r.date + " " + r.time, byId = id => records.find(r => r.id === id);
  const upc = records.filter(r => key(r) > t).sort((a, b) => key(a).localeCompare(key(b)));
  const past = records.filter(r => key(r) <= t).sort((a, b) => key(b).localeCompare(key(a)));
  const shown = pastAll ? past : past.slice(0, 10);
  const seatShort = r => r.tbd ? "예매 미확정" : r.seat ? `${r.seat.floor === "2층" ? "2층 " : ""}${r.seat.row}열 ${r.seat.num}번` : "좌석 미정";
  const rowH = r => `<div class="rrow" data-id="${r.id}" tabindex="0"><span class="dchip">${r.date.slice(5)} ${r.time}</span>
    <span class="cn">${Object.keys(ROLES).map(k => esc(r.cast[k])).join(" · ")}${r.rating ? `<span class="cardstars" style="margin:0 0 0 6px">${"★".repeat(r.rating)}</span>` : ""}</span>
    <span class="st2" ${r.tbd ? 'style="color:var(--dim)"' : ""}>${seatShort(r)}</span></div>`;

  // 쿠폰: 현재 = 이미 지난 회차까지 반영, 최종 = 예정된 회차의 자동 차감까지 반영
  const cstat = k => {
    const L = meta.coupons.filter(c => c.kind === k), sum = a => a.reduce((x, c) => x + c.qty, 0);
    const inn = sum(L.filter(c => c.type !== "사용")), out = sum(L.filter(c => c.type === "사용"));
    const pend = sum(L.filter(c => c.type === "사용" && c.rec && byId(c.rec) && key(byId(c.rec)) > t));
    return { cur: inn - out + pend, fin: inn - out, inn, out };
  };
  const cbox = k => { const c = cstat(k);
    return `<div class="cb"><b>${k}</b><div class="cnum"><div><small>현재</small><strong class="cur">${c.cur}</strong></div><div><small>최종</small><strong>${c.fin}</strong></div></div><small>적립 ${c.inn} · 사용 ${c.out}</small></div>`; };
  const dbl = cstat("더블 적립권");

  const icons = { 3: "🎟", 5: "📸", 7: "🎁" };

  const boards = meta.boards.map(b => { const tot = stampN(b);
    return `<div class="bd"><b>${esc(b.name)}</b><div class="bdr"><span class="ms">[${BENEFITS.map(([n]) => `<span class="${tot >= n ? "" : "off"}">${icons[n] || "🎫"}</span>`).join("")}]</span>

  $("list").innerHTML =
    `<div class="hc">${upc.length ? `<p class="ht">📋 예정 일정</p>${upc.map(rowH).join("")}` : `<div class="empt"><i>✈</i>예매 확정된 일정이 없습니다</div>`}</div>

    <details class="hc" open><summary class="ht">🎟 다관람 카드 현황 <span>▲</span></summary>${boards || `<div class="empt">도장판이 없어요. 쿠폰 탭에서 만들 수 있어요.</div>`}</details>
    <div class="hc"><p class="ht">📋 최근 관람</p>${past.length ? shown.map(rowH).join("") + (past.length > shown.length ? `<button type="button" class="more" data-more="1">이전 관람 ${past.length - shown.length}건 더 보기</button>` : "") : `<div class="empt">아직 관람 기록이 없어요.<br>위 <b>+ 기록</b> 버튼으로 남겨보세요.</div>`}</div>`;
}

  if (!found) return;
  Object.keys(ROLES).forEach(role => { $("cast-" + role).value = found[role]; });

function openForm(rec, pre) {

  if (!rec && pre) { if (pre.time) $("time").value = pre.time; autoCast(); }

const AX = [[1,4,0],[5,16,5],[17,20,18]];
const GX = [[1,1,3],[2,13,5],[14,17,18]];
const CX = [[1,4,3],[5,13,8],[14,17,18]];
const SEATMAP = {
  "1층": { A:AX, B:AX, C:AX, D:[[1,4,0],[5,15,5],[16,19,18]], E:[[1,3,0]], F:[[1,12,5],[13,16,18]],
           G:GX, H:GX, I:GX, J:AX, K:AX, L:AX, M:AX, N:[[1,8,0],[9,19,9]] },
  "2층": { B:[[1,5,2],[6,14,8],[15,18,18]], C:CX, D:CX, E:CX, F:CX, G:[[1,17,3]] }
};
const HOLD = ["1층A1", "1층A20", "2층B18"]; // 판매보류석은 고를 수 없어요
const gradeOf = s => s.floor === "2층" ? "S석" : s.row === "E" ? "휠체어석" : "R석";
function seatNums(floor, row) {
  const out = [];
  ((SEATMAP[floor] || {})[row] || []).forEach(([a, b]) => {
    for (let n = a; n <= b; n++) if (!HOLD.includes(floor + row + n)) out.push(n);
  });
  return out;
}
const won = n => Number(n).toLocaleString("ko-KR") + "원";
const seatText = s => s ? `${s.floor} ${s.row}열 ${s.num}번 (${gradeOf(s)})` : "좌석 미정";

$("floor").innerHTML = `<option value="">층</option><option>1층</option><option>2층</option>`;
function fillRows(row, num) {
  const rows = Object.keys(SEATMAP[$("floor").value] || {});
  $("row").innerHTML = `<option value="">열</option>` + rows.map(r => `<option value="${r}">${r}열</option>`).join("");
  if (row) $("row").value = row;
  fillNums(num);
}
function fillNums(num) {
  const f = $("floor").value, r = $("row").value;
  $("num").innerHTML = `<option value="">번호</option>` + seatNums(f, r).map(n => `<option value="${n}">${n}번</option>`).join("");
  if (num) $("num").value = num;
  $("grade").hidden = !(f && r);
  if (f && r) $("grade").textContent = gradeOf({ floor: f, row: r }) + " 구역";
}
$("floor").onchange = () => fillRows();

const TICKET_TYPES = ["없음 (일반)", "40% 할인권 (40%)", "50% 할인권 (50%)", "증빙패스", "프리뷰 할인", "조기예매 할인 (20%)",

}
$("tbd").onchange = () => setTbd($("tbd").checked);
const EVENTS = [
  // 이벤트는 여기에 한 줄씩 추가해요. 예)
  { title: "프리뷰", start: "2026-10-21", end: "2026-10-25", color: "#a8d5a2" },
  { title: "쿠폰팩 증정", start: "2026-10-27", end: "2026-11-01", color: "#c9a8e0" },
];
// 기간이 겹치지 않는 이벤트는 같은 줄(위쪽)에 놓고, 겹칠 때만 아래 줄로 내려요
const LANES = [];
EVENTS.forEach((e, i) => {
  const used = new Set();
  for (let k = 0; k < i; k++) { const o = EVENTS[k]; if (e.start <= (o.end || o.start) && o.start <= (e.end || e.start)) used.add(LANES[k]); }
  let l = 0; while (used.has(l)) l++;
  LANES[i] = l;
});
const evOn = d => EVENTS.map((e, i) => ({ ...e, i: LANES[i] })).filter(e => d >= e.start && d <= (e.end || e.start));

function renderCal() {
  $("calFilter").innerHTML = Object.keys(ROLES).map(role => `
    <div class="flt"><span class="chip ${ROLE_CLASS[role]}">${role}</span>
      ${["", ...ROLES[role]].map(n =>
        `<button type="button" class="fb ${filt[role] === n ? "on" : ""}" data-role="${role}" data-name="${n}">${n || "전체"}</button>`).join("")}
    </div>`).join("");
  $("calTitle").textContent = `${calY}년 ${calM + 1}월`;
  const first = new Date(calY, calM, 1).getDay(), last = new Date(calY, calM + 1, 0).getDate();
  const todayStr = `${now.getFullYear()}-${pad(now.getMonth() + 1)}-${pad(now.getDate())}`;
  let h = [..."일월화수목금토"].map(d => `<div class="dow">${d}</div>`).join("") + "<div></div>".repeat(first);
  for (let d = 1; d <= last; d++) {
    const date = `${calY}-${pad(calM + 1)}-${pad(d)}`, ev = evOn(date);
    const bars = Array.from({ length: ev.length ? Math.max(...ev.map(e => e.i)) + 1 : 0 }, (_, i) => {
      const e = ev.find(x => x.i === i);
      if (!e) return `<span class="eb nil"></span>`;
      const dow = new Date(date + "T00:00").getDay(), end = e.end || e.start;
      const show = date === e.start || d === 1 || dow === 0;
      const cls = `${date === e.start || dow === 0 ? "s" : ""} ${date === end || dow === 6 ? "e" : ""} ${show && dow !== 6 ? "lb" : ""}`;
      return `<span class="eb ${cls}" style="background:${e.color || "var(--rose)"}">${show ? esc(e.title) : ""}</span>`;
    }).join("");
    const shown = dayTimes(date).filter(t => !filtOn() || matches(castOf(date, t)));
    const times = shown.map(t => {
      const rec = records.find(r => r.date === date && r.time === t), ok = rec && !rec.tbd;
      return `<span class="tm ${ok ? "seen" : ""}">${ok ? "✓ " : ""}${t}</span>`;
    }).join("");
    h += `<button type="button" class="day ${SCHEDULE[date] ? "" : "off"} ${filtOn() && SCHEDULE[date] && !shown.length ? "nm" : ""} ${date === selDay ? "sel" : ""} ${date === todayStr ? "today" : ""} ${["sun", "", "", "", "", "", "sat"][new Date(date + "T00:00").getDay()]}" data-date="${date}"><span class="dn">${d}</span>${bars}${times}</button>`;
  }
  $("calGrid").innerHTML = h;
  renderDetail();
}

function renderDetail() {
  if (!selDay) { $("calDetail").innerHTML = `<p class="count">날짜를 누르면 그날의 회차와 이벤트가 보여요. <span style="color:var(--ok)">✓</span> 기록한 회차</p>`; return; }
  const evs = evOn(selDay).map(e => `<div class="sess" style="border-left:4px solid ${e.color || "var(--rose)"}"><div><b>${esc(e.title)}</b>
    <div class="meta">${e.start.slice(5).replace("-", "/")}${e.end && e.end !== e.start ? " ~ " + e.end.slice(5).replace("-", "/") : ""}${e.note ? " · " + esc(e.note) : ""}</div></div></div>`).join("");
  const rows = dayTimes(selDay).filter(t => !filtOn() || matches(castOf(selDay, t))).map(t => {
    const rec = records.find(r => r.date === selDay && r.time === t);

    return `<div class="sess"><div><b>${t}</b>${rec ? ` <span class="seen" ${rec.tbd ? 'style="color:var(--dim)"' : ""}>${rec.tbd ? "예매 미확정" : "✓ 예매확정"}</span>` : ""}
      <div class="chips">${Object.keys(ROLES).map(role => `<span class="chip ${ROLE_CLASS[role]}">${role} ${esc(cast[role])}</span>`).join("")}</div></div>
      <button type="button" data-time="${t}" data-id="${rec ? rec.id : ""}">${rec ? "수정" : "기록"}</button></div>`;

  $("calDetail").innerHTML = `<h3>${formatWhen(selDay, "").trim()}</h3>` + evs +
    (rows || `<p class="note">${filtOn() && dayTimes(selDay).length ? "고른 배우가 나오는 회차가 없어요." : "이 날은 일정표에 공연이 없어요."}</p>`) +
    `<button type="button" class="more" data-time="">이 날짜에 직접 기록 추가</button>`;
}

/* ===== 8. 통계 ===== */
const PAIRS = ["프란체스|레미", "프란체스|조이", "레미|조이"];
let pairBase = "프란체스";
const FIXED = { "프란체스": "랑연", "레미": "정단비", "조이": "공현비" }; // 항상 함께 나오는 고정 캐스팅

function bar(label, val, max, color, text) {
  return `<div class="bar"><span>${esc(label)}</span><div class="track"><i style="width:${max ? val / max * 100 : 0}%;background:${color}"></i></div><b>${text || val}</b></div>`;
}

function heatmap(floor) {
  const cnt = {};
  records.forEach(r => {
    if (r.seat && r.seat.floor === floor) { const k = r.seat.row + r.seat.num; cnt[k] = (cnt[k] || 0) + 1; }
  });
  const rows = Object.keys(SEATMAP[floor]).map(row => {
    const cells = SEATMAP[floor][row].map(([a, b, c]) => {
      let s = "";
      for (let n = a; n <= b; n++) {
        const k = cnt[row + n] || 0;
        s += `<i class="s ${HOLD.includes(floor + row + n) ? "hold" : "lv" + Math.min(k, 5)}" style="grid-column:${c + n - a + 1}" title="${floor} ${row}${n} · ${k}회"></i>`;
      }
      return s;
    }).join("");
    return `<div class="hrow"><span class="rl">${row}</span><div class="hcells">${cells}</div></div>`;
  }).join("");
  return `<h4>${floor}</h4>${floor === "1층" ? `<div class="stage">STAGE</div>` : ""}${rows}`;
}

const tbl = (head, rows) => `<table class="tb"><thead><tr>${head.map(x => `<th>${x}</th>`).join("")}</tr></thead><tbody>${rows.map(r => `<tr>${r.map(c => `<td>${c}</td>`).join("")}</tr>`).join("")}</tbody></table>`;
const allCasts = () => Object.values(SCHEDULE).flatMap(d => Object.values(d));

function renderStats() {
  const S = allCasts(), hide = meta.settings.hide;
  let h = `<h3>배우별 관람 횟수</h3>`;
  Object.keys(ROLES).forEach(role => {
    h += `<h4>${role}</h4>` + tbl(["배우", "총 회차", "관람"], ROLES[role].map(nm =>
      [esc(nm), S.filter(c => c[role] === nm).length, records.filter(r => r.cast[role] === nm).length]));
  });
  const [o1, o2] = Object.keys(ROLES).filter(r => r !== pairBase);
  h += `<h3>페어 조합별</h3><div class="flt"><span class="meta" style="margin-right:6px">기준</span>${Object.keys(ROLES).map(r =>
      `<button type="button" class="fb ${r === pairBase ? "on" : ""}" data-base="${r}">${r}</button>`).join("")}</div>` +
    tbl([pairBase, o1, o2, "총 회차", "관람"], ROLES[pairBase].flatMap(a => ROLES[o1].flatMap(x => ROLES[o2].flatMap(y => {
      const fx = [[pairBase, a], [o1, x], [o2, y]].filter(([r, n]) => FIXED[r] === n).length;
      if (fx !== 0 && fx !== 3) return [];
      return [[esc(a), esc(x), esc(y),
        S.filter(c => c[pairBase] === a && c[o1] === x && c[o2] === y).length,
        records.filter(r => r.cast[pairBase] === a && r.cast[o1] === x && r.cast[o2] === y).length]];
    }))));

  h += `<h3>좌석 히트맵</h3><div class="legend">${[0, 1, 2, 3, 4, 5].map(i =>
    `<span><i class="s lv${i}"></i>${i === 5 ? "5회+" : i + "회"}</span>`).join("")}</div>` + heatmap("1층") + heatmap("2층");

  const priced = records.filter(r => r.price != null), total = priced.reduce((s, r) => s + r.price, 0);
  const rated = records.filter(r => r.rating), row = (l, v) => `<div class="srow"><span>${l}</span><b>${v}</b></div>`;
  const mon = {};
  priced.forEach(r => { const k = r.date.slice(0, 7); mon[k] = (mon[k] || 0) + r.price; });
  const mk = Object.keys(mon).sort(), mm = Math.max(...mk.map(k => mon[k]), 0);
  h += `<div class="sp-h"><h3>지출 현황</h3><button type="button" class="fb" data-hide="1">${hide ? "보기" : "숨기기"}</button></div>
    <div class="${hide ? "blur" : ""}">${row("총 지출", won(total))}${row("평균 티켓가", priced.length ? won(Math.round(total / priced.length)) : "-")}
    ${row("유료 관람 횟수", priced.length + "회")}${row("평균 별점", rated.length ? "★ " + (rated.reduce((s, r) => s + r.rating, 0) / rated.length).toFixed(1) : "-")}
    <h4>월별 지출</h4>${mk.length ? mk.map(k => bar(k.replace("-", "년 ") + "월", mon[k], mm, "var(--j)", won(mon[k]))).join("") : `<p class="note">가격을 입력하면 월별 지출이 보여요.</p>`}</div>`;
  $("statsBox").innerHTML = h;
}
$("statsBox").onclick = e => {
  const b = e.target.closest("button");
  if (!b) return;
  if (b.dataset.base) pairBase = b.dataset.base;
  if (b.dataset.hide) { meta.settings.hide = !meta.settings.hide; saveMeta(); }
  renderStats();
};

const PACK = [["더블 적립권", "더블 적립권"], ["증빙패스", "증빙패스"], ["40% 할인권", "40% 할인권"], ["MD 50% 할인권", "MD 50% 할인권"]]; // 쿠폰팩 1세트 구성 (공연 정보에 맞게 고쳐 쓰세요)

const stampN = b => b.stamps.reduce((s, x) => s + x.qty, 0);

/* 기록과 도장 연동: 기록을 저장하면 고른 도장판에 1칸이 찍혀요 */
/* 기록에서 고른 쿠폰종이 할인권이면 쿠폰 수량에서 1장 자동 차감해요 (기록을 고치거나 지우면 함께 바뀌어요) */
const AUTO_USE = { "40% 할인권 (40%)": "40% 할인권", "50% 할인권 (50%)": "50% 할인권", "증빙패스": "증빙패스" };
function syncCoupon(rec) {
  meta.coupons = meta.coupons.filter(c => c.rec !== rec.id);
  const kind = AUTO_USE[rec.coupon];
  if (kind) meta.coupons.push({ id: uid(), kind, type: "사용", qty: 1, date: rec.date, memo: "관극 기록에서 자동 차감", rec: rec.id });
  saveMeta();
}
function unstamp(id) { meta.boards.forEach(b => { b.stamps = b.stamps.filter(s => s.rec !== id); }); }
function linkStamp(rec, bid) {
  unstamp(rec.id);
  const b = meta.boards.find(x => x.id === bid);
  if (b) b.stamps.push({ id: uid(), date: rec.date, how: "직접 관람", qty: 1, memo: "", rec: rec.id });
  saveMeta();
}
$("board").onchange = () => { $("newBoard").hidden = $("board").value !== "__new"; };
function boardId() {
  let v = $("board").value;
  if (v === "__new") {
    const b = { id: uid(), name: $("newBoard").value.trim() || `도장판 ${meta.boards.length + 1}`, stamps: [] };
    meta.boards.push(b); v = b.id;
  }
  return v;
}
function fillBoards(rec) {
  const cur = rec && meta.boards.find(b => b.stamps.some(s => s.rec === rec.id));
  $("board").innerHTML = `<option value="">연동 안 함</option>` + meta.boards.map(b => `<option value="${b.id}">${esc(b.name)}</option>`).join("") + `<option value="__new">+ 새 도장판 만들기</option>`;
  $("board").value = cur ? cur.id : "";
  $("newBoard").value = ""; $("newBoard").hidden = true;
}

/* ===== 11. 설정: 다크모드, 백업/복원, 홈 화면 추가 ===== */
let deferred = null;
addEventListener("beforeinstallprompt", e => { e.preventDefault(); deferred = e; renderSettings(); });
/* 최근 업데이트 날짜: 수정할 때마다 이 날짜가 바뀌어요 */
const APP_UPDATED = "2026.10.30";
function renderSettings() {
  const t = meta.settings.theme;
  $("setBox").innerHTML = `<h3>화면 모드</h3>` + [["auto", "자동"], ["light", "라이트"], ["dark", "다크"]].map(([v, l]) =>
      `<button type="button" class="fb ${t === v ? "on" : ""}" data-th="${v}">${l}</button>`).join("") +
    `<h3>데이터 백업/복원</h3><p class="meta">기록·쿠폰·도장판이 한 파일에 담겨요. 브라우저 데이터를 지우기 전에 꼭 내보내 두세요.</p>
    <div class="row" style="margin-top:10px"><button type="button" data-a="exp">JSON 내보내기</button><button type="button" data-a="imp">JSON 가져오기</button></div>
    <h3>홈 화면에 추가</h3><p class="meta">아이폰은 공유 버튼 → "홈 화면에 추가", 안드로이드는 브라우저 메뉴 → "홈 화면에 추가"를 고르면 앱처럼 열려요.</p>
    ${deferred ? `<button type="button" class="more" data-a="pwa">홈 화면에 추가</button>` : ""}
    <h3>이벤트</h3><p class="meta">등록된 이벤트 ${EVENTS.length}개 · 캘린더에 색 띠로 표시돼요.</p>
    <h3>앱 업데이트</h3><p class="meta">최근 업데이트 <b style="color:var(--silver)">${APP_UPDATED}</b></p>`;
}
async function exportData() {
  const text = JSON.stringify({ app: "v-ever-after", v: 3, records, meta }, null, 1), name = `v-ever-after-backup-${today()}.json`;
  try { // claude.ai 게시 페이지에서는 저장 확인창을 거쳐요
    const dl = window.claude && claude.use ? await claude.use("downloads") : null;
    if (dl) { await dl.save({ filename: name, data: text }); return; }
  } catch (err) { if (err && err.code === "declined") return; }
  const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([text], { type: "application/json" })); a.download = name;
  document.body.append(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 2000);
}
$("setBox").onclick = e => {
  const b = e.target.closest("button");
  if (!b) return;
  if (b.dataset.th) { meta.settings.theme = b.dataset.th; saveMeta(); applyTheme(); renderSettings(); }
  else if (b.dataset.a === "exp") exportData();
  else if (b.dataset.a === "imp") $("imp").click();
  else if (b.dataset.a === "pwa" && deferred) { deferred.prompt(); deferred = null; renderSettings(); }
};
$("imp").onchange = async e => {
  const f = e.target.files[0]; e.target.value = "";
  if (!f) return;
  try {
    const d = JSON.parse(await f.text());
    if (!Array.isArray(d.records)) throw 0;
    if (!confirm(`기록 ${d.records.length}개를 가져와요. 지금 저장된 데이터는 덮어써져요. 계속할까요?`)) return;
    records = d.records; meta = fixMeta(d.meta); save(); saveMeta(); applyTheme(); render();
  } catch (err) { alert("가져올 수 없는 파일이에요. 이 앱에서 내보낸 JSON 파일인지 확인해 주세요."); }
};

applyTheme();
render();
</script>
</body>
